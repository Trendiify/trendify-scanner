name: Build Trendify Scanner

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download modules
        run: go mod tidy

      - name: Build scanner
        run: go build ./...

      - name: Test
        run: go test ./...
